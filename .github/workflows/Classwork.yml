name: Classwork

on:
  push:

jobs:
  one:
    runs-on: ubuntu-latest

    steps:
      - name: Create file
        run: echo "Saflos is good" > note.txt

      - name: Display file
        run: cat note.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-file
          path: note.txt

  two:
    runs-on: ubuntu-latest
    needs: one

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: note-file

      - name: Display file
        run: cat note.txt
