name: PR-gate
on:
  pull_request:
    branches: [PR-gate]
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
         os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@<SHA> # v7.0.1
      - uses: actions/setup-python@<SHA> # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the check
        run: python capstone/check.py
